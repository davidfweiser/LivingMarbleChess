<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Living Marble - 3D Fighting Chess</title>
<meta name="description" content="Chess on a floating board where the pieces come alive and fight for every capture.">
<style>
  :root { color-scheme: dark; --bg: #050403; --text: #ede5d6; --dim: #9d8f7f; --gold: #f2c873; --panel: rgba(14, 11, 10, 0.92); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
               font: 16px/1.5 "Segoe UI", system-ui, -apple-system, "DejaVu Sans", sans-serif; }
  /* the game keeps the canvas's drawing buffer at this size in device pixels */
  #canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
            outline: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             padding: 16px; box-sizing: border-box; background: var(--bg); }
  #overlay.hidden { display: none; }
  .card { max-width: 34rem; text-align: center; }
  h1 { font: 400 clamp(1.8rem, 6vw, 2.6rem)/1.2 Georgia, "DejaVu Serif", serif; color: var(--gold); margin: 0 0 0.2em; }
  .sub { color: var(--dim); margin: 0 0 1.6em; }
  #status { min-height: 1.5em; }
  #error { display: none; text-align: left; background: var(--panel); border: 1px solid #5a4630; border-radius: 10px;
           padding: 14px 18px; margin-top: 1em; }
  #error.shown { display: block; }
  #error p { margin: 0.4em 0; }
  .version { color: var(--dim); font-size: 0.85em; margin-top: 2em; }
  a { color: var(--gold); }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="overlay">
  <div class="card">
    <h1>Living Marble</h1>
    <p class="sub">3D Fighting Chess</p>
    <div id="status">Loading the game...</div>
    <div id="error"></div>
    <div class="version">Version @PROJECT_VERSION@ &middot;
      <a href="https://github.com/davidfweiser/LivingMarbleChess" target="_blank" rel="noopener">source</a> &middot;
      <a href="THIRD_PARTY_NOTICES.txt" target="_blank">notices</a></div>
  </div>
</div>
<script>
(function () {
  var canvas = document.getElementById('canvas');
  var overlay = document.getElementById('overlay');
  var statusEl = document.getElementById('status');
  var errorEl = document.getElementById('error');

  function fail(html) {
    overlay.classList.remove('hidden');
    statusEl.textContent = '';
    errorEl.innerHTML = html;
    errorEl.classList.add('shown');
  }

  // Options in the address, as on the command line: ?pieces=medieval&quality=3&graphics=3&demo
  var args = [];
  var q = new URLSearchParams(location.search);
  var pieces = q.get('pieces');
  if (pieces && /^(marble|medieval|alien|aliens)$/.test(pieces)) args.push('--pieces', pieces);
  [['quality', /^[0-3]$/], ['graphics', /^[0-3]$/], ['level', /^[0-4]$/]].forEach(function (o) {
    var v = q.get(o[0]);
    if (v !== null && o[1].test(v)) args.push('--' + o[0], v);
  });
  ['demo', 'mute', 'dof'].forEach(function (f) { if (q.has(f)) args.push('--' + f); });
  if (q.has('no-music') || q.has('nomusic')) args.push('--no-music');
  var fen = q.get('fen');
  if (fen && /^[1-8pnbrqkPNBRQK\/]+ [wb] [KQkq-]+ [a-h1-8-]+( \d+ \d+)?$/.test(fen)) args.push('--fen', fen);
  var join = q.get('join');  // a friend's online game
  if (join && /^[A-Za-z0-9]{4,16}$/.test(join)) args.push('--join', join.toUpperCase());

  // What the game needs from the browser
  var gl = document.createElement('canvas').getContext('webgl2');
  if (!gl) {
    fail('<p><b>This browser can\'t show the game.</b></p><p>It needs WebGL 2, which current versions of ' +
         'Chrome, Edge, Firefox and Safari have. If yours is up to date, check that hardware acceleration ' +
         'is turned on in its settings.</p>');
    return;
  }
  if (!gl.getExtension('EXT_color_buffer_float')) {
    fail('<p><b>This browser\'s graphics are missing a feature the game needs</b> (EXT_color_buffer_float). ' +
         'A current version of Chrome, Edge, Firefox or Safari should have it.</p>');
    return;
  }
  if (!self.crossOriginIsolated) {
    fail('<p><b>The game can\'t start its threads on this page.</b></p><p>The web server has to send two headers ' +
         'with the page: <code>Cross-Origin-Opener-Policy: same-origin</code> and ' +
         '<code>Cross-Origin-Embedder-Policy: require-corp</code>. See web/README.md.</p>');
    return;
  }

  // Online games: the connection to the server (web/relay.py, at /ws on this server). The game
  // (src/net.cpp) sends plain commands and reads plain lines from the inbox.
  window.lmNet = (function () {
    var ws = null, open = false, inbox = [], outbox = [], room = null, seeking = false, tries = 0, timer = 0;
    function post(s) { inbox.push(s); }
    function store(key, value) {  // this browser's player key and its sides in games
      try {
        if (value === null) localStorage.removeItem(key);
        else if (value !== undefined) localStorage.setItem(key, value);
        return localStorage.getItem(key) || '';
      } catch (e) { return ''; }
    }
    function linkTo(code) {
      var u = new URL(location.href);
      u.search = ''; u.hash = '';
      u.searchParams.set('join', code);
      return u.toString();
    }
    function setAddress(code) {  // the address bar shows the game's link (a reload comes back to it)
      try {
        var u = new URL(location.href);
        if (code) u.searchParams.set('join', code); else u.searchParams.delete('join');
        history.replaceState(null, '', u.toString());
      } catch (e) {}
    }
    function raw(m) { ws.send(JSON.stringify(m)); }
    function send(m) { if (open) raw(m); else { outbox.push(m); connect(); } }
    function clockLine(c) { return 'clock ' + (c.w | 0) + ' ' + (c.b | 0) + ' ' + (c.run || '-'); }
    function endLine(e) {
      var r = e.ratings;
      return ['end', e.result, e.why].concat(r ? [r.w[0], r.w[1], r.b[0], r.b[1]] : []).join(' ');
    }
    function receive(m) {
      if (m.t === 'room') {
        room = m.room;
        seeking = false;
        store('lm-game-' + room, m.token);
        setAddress(room);
        post('link ' + linkTo(room));
        post(['room', room, m.seat, m.full ? 1 : 0, m.peer ? 1 : 0, m.rated ? 1 : 0].concat(m.moves || []).join(' '));
        if (m.players) post(['players', m.players.w.name, m.players.w.rating, m.players.b.name, m.players.b.rating].join(' '));
        if (m.clock) post(clockLine(m.clock));
        if (m.end) post(endLine(m.end));
        if (m.draw) post('draw');
        if (m.forfeit != null) post('away ' + m.forfeit);
      } else if (m.t === 'move') { post('move ' + (m.ply | 0) + ' ' + m.uci); if (m.clock) post(clockLine(m.clock)); }
      else if (m.t === 'clock') post(clockLine(m.clock));
      else if (m.t === 'peer') { post('peer ' + (m.here ? 1 : 0)); if (m.forfeit != null) post('away ' + m.forfeit); }
      else if (m.t === 'end') post(endLine(m));
      else if (m.t === 'new' || m.t === 'draw' || m.t === 'declined') post(m.t);
      else if (m.t === 'seeking') post('seeking ' + (m.waiting | 0));
      else if (m.t === 'need_name') { seeking = false; post('needname'); }
      else if (m.t === 'notice') post('notice ' + m.why);
      else if (m.t === 'error') { room = null; setAddress(null); post('error ' + m.why); }
      else if (m.t === 'me') {
        if (m.secret) store('lm-player', m.secret);
        if (m.name) post(['me', m.name, m.rating, m.games].join(' '));
        else { store('lm-player', null); post('me -'); }  // (a key the server doesn't know)
      } else if (m.t === 'top') {
        var me = m.me || {};
        var line = ['top', m.min | 0, me.rank | 0, me.rating | 0, me.games | 0];
        (m.players || []).forEach(function (p) { line.push(p[0], p[1], p[2]); });
        post(line.join(' '));
      }
    }
    function connect() {
      if (ws) return;
      clearTimeout(timer); timer = 0;
      post(tries ? 'status lost' : 'status connecting');
      var s;
      try { s = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'); }
      catch (e) { post('error Online games aren\'t available here.'); post('status closed'); return; }
      ws = s;
      s.onopen = function () {
        open = true;
        tries = 0;
        var key = store('lm-player');
        if (key) raw({ t: 'hello', secret: key });
        if (room) raw({ t: 'join', room: room, token: store('lm-game-' + room) });
        if (seeking) raw({ t: 'seek' });
        var q = outbox; outbox = [];
        q.forEach(raw);
        post('status open');
      };
      s.onmessage = function (e) {
        var m;
        try { m = JSON.parse(e.data); } catch (x) { return; }
        receive(m);
      };
      s.onclose = function (e) {
        if (ws !== s) return;
        var wasOpen = open;
        ws = null; open = false;
        if (e.code === 4000) { room = null; setAddress(null); post('error This game is now open in another tab or window.'); }
        if (e.code === 4002) {
          room = null; seeking = false; outbox = [];
          post('error The server is too busy right now. Try again in a while.');
          post('status closed');
          return;
        }
        if (!room && !seeking && !outbox.length) { post('status closed'); return; }  // (nothing to come back to)
        tries++;
        if (!wasOpen && tries > 3) {
          room = null; seeking = false; outbox = [];
          post('error The server for online games can\'t be reached.');
          post('status closed');
          return;
        }
        post('status lost');  // try again, waiting longer each time (up to half a minute)
        timer = setTimeout(connect, Math.min(30000, 1000 * Math.pow(2, Math.min(tries - 1, 5))));
      };
    }
    function copy() {
      var l = room ? linkTo(room) : '';
      if (l && navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(l).then(function () { post('copied 1'); }, function () { post('copied 0'); });
      else post('copied 0');
    }
    return {
      inbox: inbox,
      cmd: function (c) {
        var i = c.indexOf(' '), verb = i < 0 ? c : c.slice(0, i), arg = i < 0 ? '' : c.slice(i + 1);
        if (verb === 'create') { room = null; seeking = false; send({ t: 'create' }); }
        else if (verb === 'join') {
          room = arg.toUpperCase(); seeking = false;
          if (open) raw({ t: 'join', room: room, token: store('lm-game-' + room) }); else connect();
        } else if (verb === 'seek') {
          room = null; seeking = true; setAddress(null);
          if (open) raw({ t: 'seek' }); else connect();
        } else if (verb === 'unseek') { seeking = false; if (open) raw({ t: 'unseek' }); }
        else if (verb === 'move') { var a = arg.split(' '); send({ t: 'move', ply: +a[0], uci: a[1] }); }
        else if (verb === 'register') send({ t: 'register', name: arg });
        else if (verb === 'hello') connect();
        else if (verb === 'sync') { if (room && open) raw({ t: 'join', room: room, token: store('lm-game-' + room) }); }
        else if (verb === 'copy') copy();
        else if (verb === 'close') {
          room = null; seeking = false; outbox = []; setAddress(null);
          if (open) raw({ t: 'leave' });
        } else if (verb === 'top' || verb === 'new' || verb === 'resign' || verb === 'draw' || verb === 'decline') send({ t: verb });
      }
    };
  })();

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });  // right-drag turns the board
  window.addEventListener('keydown', function (e) { if (e.key === 'F1') e.preventDefault(); });  // the game's help
  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    fail('<p><b>The graphics stopped working</b> (the browser took the WebGL context back). Reload the page to play again.</p>');
  });

  window.Module = {
    canvas: canvas,
    arguments: args,
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) {
      if (!t) return;
      var m = t.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
      statusEl.textContent = m ? 'Loading the game... ' + Math.round(100 * m[1] / m[3]) + '%' : 'Loading the game...';
    },
    // from here the game draws its own loading screen while it sculpts the pieces
    onRuntimeInitialized: function () { overlay.classList.add('hidden'); canvas.focus(); },
    onAbort: function (what) {
      fail('<p><b>The game stopped with an error.</b></p><p>' + String(what).replace(/[<&]/g, '') +
           '</p><p>Reloading the page may help. With little memory free, close other tabs first.</p>');
    }
  };
  window.addEventListener('error', function (e) {
    if (e && e.message && /memory|wasm|WebAssembly/i.test(e.message))
      fail('<p><b>The game couldn\'t start:</b> ' + e.message.replace(/[<&]/g, '') + '</p>');
  });

  var s = document.createElement('script');
  s.src = 'living_marble.js';
  s.onerror = function () { fail('<p><b>The game\'s files couldn\'t be loaded.</b> Check the connection and reload.</p>'); };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
